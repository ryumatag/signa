[package]
name = "signa"
version = "0.4.1"  #:version
license = "MIT OR Apache-2.0"
repository = "https://github.com/ryumatag/signa"
documentation = "https://docs.rs/signa"
readme = "README.md"
description = '''
A low-level SIP library for Rust that handles transactions, down to the last retransmission.
'''
keywords = ["sip", "rfc3261", "voip", "telephony"]
categories = ["network-programming"]
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
# The README is a symlink to the one at the workspace root. Cargo packages the
# file it points to, so `include_str!` reads the same path in a checkout and in
# a package.
include = [
  "/src/**/*.rs",
  "/tests/**/*.rs",
  "/README.md",
  "LICENSE-APACHE",
  "LICENSE-MIT",
]

[features]
default = ["tokio"]
# The endpoint and its sockets, from signa-core.
tokio = ["signa-core/tokio"]
# signa-ua's dialogs and INVITE usage, as `signa::ua`. Its UA runs on an
# endpoint, so it needs `tokio`, and without its own `tokio` feature signa-ua
# has no public API.
ua = ["tokio", "dep:signa-ua", "signa-ua/tokio"]

[dependencies]
signa-core = { version = "0.1.1", path = "../signa-core", default-features = false }
signa-ua = { version = "0.1.0", path = "../signa-ua", default-features = false, optional = true }

[dev-dependencies]
bytes = "1.12.1"
# The README's quick start runs as a doctest.
tokio = { version = "1.54", features = ["macros", "rt-multi-thread"] }

# The facade's re-exports through the public API.
[[test]]
name = "facade"
required-features = ["tokio"]

# docs.rs builds the default features only, which would leave `signa::ua` out.
[package.metadata.docs.rs]
features = ["ua"]
