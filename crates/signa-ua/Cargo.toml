[package]
name = "signa-ua"
version = "0.1.1"  #:version
license = "MIT OR Apache-2.0"
repository = "https://github.com/ryumatag/signa"
documentation = "https://docs.rs/signa-ua"
readme = "README.md"
description = '''
Dialogs and INVITE usage on signa-core, for SIP user agents.
'''
keywords = ["sip", "rfc3261", "voip", "telephony"]
categories = ["network-programming"]
# The integration tests are one binary of modules, `tests/lib.rs`, so a new
# file under `tests/` runs only once a module declares it.
autotests = false
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
include = [
  "/src/**/*.rs",
  "/README.md",
  "LICENSE-APACHE",
  "LICENSE-MIT",
]

[features]
default = ["tokio"]
# The runtime that drives the UA on a signa-core endpoint. Without it, only the
# state model builds, which has no public API.
tokio = ["dep:tokio", "signa-core/tokio"]
# Exposes entry points for the fuzz targets in `fuzz/`. Unstable, with no
# semver guarantee. Not for use outside this repository.
__fuzz = []

[dependencies]
bytes = { version = "1.12.1", default-features = false, features = ["std"] }
# RFC 3261 section 19.3 requires tags with cryptographic randomness.
getrandom = { version = "0.4", default-features = false }
signa-core = { version = "0.1.2", path = "../signa-core", default-features = false }
# The productions and element scans of RFC 3261 section 25.1, for the few
# headers a UA reads.
siparse = "0.4.7"
tokio = { version = "1.54", default-features = false, features = ["macros", "rt", "sync", "time"], optional = true }

[dev-dependencies]
quickcheck = { version = "1.1", default-features = false }
tokio = { version = "1.54", features = ["macros", "net", "rt-multi-thread", "test-util"] }
# The external Tower adapter in `tests/tower/`, and the doctest that a retry
# middleware cannot replay an INVITE. Never a dependency of the crate itself.
tower = { version = "0.5.3", features = ["buffer", "limit", "retry", "timeout", "util"] }

# The runtime through the public API, against raw UDP and TCP peers and other
# UAs. One binary links once, shares its fixtures, and lets a lock such as
# `FLOODING` cover every test that takes it.
[[test]]
name = "integration"
path = "tests/lib.rs"
required-features = ["tokio"]

# What the UA keeps of received messages, by a counting allocator, which needs
# a binary to itself.
[[test]]
name = "memory"
required-features = ["tokio"]
