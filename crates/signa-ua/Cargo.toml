[package]
name = "signa-ua"
version = "0.0.1"  #:version
license = "MIT OR Apache-2.0"
repository = "https://github.com/ryumatag/signa"
documentation = "https://docs.rs/signa-ua"
readme = "README.md"
description = '''
Dialogs and INVITE usage on signa-core, for SIP user agents.
'''
keywords = ["sip", "rfc3261", "voip", "telephony"]
categories = ["network-programming"]
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
include = [
  "/src/**/*.rs",
  "/README.md",
  "LICENSE-APACHE",
  "LICENSE-MIT",
]

[dependencies]
signa-core = { version = "0.1.0", path = "../signa-core", default-features = false }
