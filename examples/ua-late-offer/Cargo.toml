# A call whose INVITE carries no offer, answered in the ACK by a provider.
[package]
publish = false
name = "ua-late-offer"
version = "0.0.0"
edition = "2024"
# The crates' MSRV, so that clippy suggests nothing they could not use.
rust-version = "1.85"

# Each example is a workspace of its own, so that its dependencies do not pile
# up on the crates.
[workspace]

[dependencies]
bytes = "1.12.1"
signa = { path = "../../crates/signa", features = ["ua"] }
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "time"] }

[[bin]]
name = "ua-late-offer"
path = "main.rs"
