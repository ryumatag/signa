# A stateful proxy that forks INVITEs, relays 2xx and cancels branches.
[package]
publish = false
name = "fork-proxy"
version = "0.0.0"
edition = "2024"
# The crates' MSRV, so that clippy suggests nothing they could not use.
rust-version = "1.85"

# Each example is a workspace of its own, so that its dependencies do not pile
# up on the crates.
[workspace]

[dependencies]
bytes = "1.12.1"
signa = { path = "../../crates/signa" }
tokio = { version = "1.54", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "sync",
  "time",
] }

[[bin]]
name = "fork-proxy"
path = "main.rs"
