name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  RUSTFLAGS: -Dwarnings

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: stable
            os: ubuntu-latest
            rust: stable
          - build: beta
            os: ubuntu-latest
            rust: beta
          - build: nightly
            os: ubuntu-latest
            rust: nightly
          - build: windows
            os: windows-latest
            rust: stable
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - name: Test
        run: cargo test --workspace --verbose
      - name: Test without default features
        run: cargo test --workspace --no-default-features --verbose
      - name: Test each crate on its own
        shell: bash
        run: scripts/test-packages

  # Runs the examples, which check their own outcomes and fail otherwise. They
  # use RFC 3261's timers, so each one's graceful shutdown waits about 32 s for
  # Timer J, L, M or D. Each is a workspace of its own, built through the
  # `signa` facade. The external Tower fixture in signa-core's `tests/` runs
  # with the tests above.
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        example:
          - options
          - invite-uas
          - invite-uac
          - fork-proxy
          - stateless-proxy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Run the example
        run: cargo run --manifest-path examples/${{ matrix.example }}/Cargo.toml

  # Runs every benchmark once and checks its assertions, so a change that
  # breaks a benchmark fails here instead of in a later comparison.
  test-bench:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Run benchmark tests
        run: cargo bench --manifest-path bench/Cargo.toml -- --test

  clippy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy
      # The examples are outside the workspace, so each gets its own run.
      - name: Run clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy --workspace --all-targets --no-default-features -- -D warnings
          cargo clippy --manifest-path bench/Cargo.toml --all-targets -- -D warnings
          for manifest in examples/*/Cargo.toml; do
            cargo clippy --manifest-path "$manifest" --all-targets -- -D warnings
          done

  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt
      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path bench/Cargo.toml -- --check
          for manifest in examples/*/Cargo.toml; do
            cargo fmt --manifest-path "$manifest" -- --check
          done

  # A dependency's newest release can need a newer Rust than the MSRV. The
  # fallback resolver picks the newest release that the MSRV can build.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - name: Test
        run: cargo +1.85 test --workspace --verbose
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback

  # Features decide which items exist and which modules are public, so an
  # intra-doc link can resolve under one set and break under another. Each set
  # is built with and without the private items.
  rustdoc:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Build docs
        run: |
          for features in --all-features --no-default-features ''; do
            for private in '' --document-private-items; do
              echo "::group::cargo doc $features $private"
              cargo doc --workspace --no-deps $features $private
              echo "::endgroup::"
            done
          done

  # signa's own `unsafe` is `from_utf8_unchecked` on bytes a check has
  # accepted, which Miri cannot verify. The tests still drive siparse's
  # raw-pointer cursor and the `bytes` crate's buffer sharing with signa's
  # inputs, so this catches undefined behavior there that siparse's own tests
  # may not reach.
  #
  # The socket tests are `#[cfg_attr(miri, ignore)]`, since Miri has no
  # network I/O.
  miri:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: miri
      - name: Run tests under Miri
        run: cargo miri test --workspace --verbose
