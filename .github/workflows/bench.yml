name: bench

# A comparison takes about ten minutes, and most changes do not need one. A
# branch or pull request runs it only when its head commit asks with one of
# the trailers below. A signa-core release tag always runs it, against the
# signa-core release before it. The benchmarks measure signa-core alone, so
# the signa-ua and facade tags do not.
#
# Pull requests compare against their base, and a push to an `rt/` branch
# against where it left `main`, so a branch can be measured on a push
# before it has a pull request. A squash merge lands the same tree on
# `main`, so a push there is not benchmarked again.
#
# Any of these trailers in the head commit message requests a run, and
# each adjusts it:
#
#   Bench-Filter: ^endpoint/   benchmarks to run, or `default` for FILTER
#   Bench-Base: HEAD~1         base revision, relative to the head
#
# `Bench-Filter: default` runs FILTER, for a request that changes nothing
# else. `Bench-Base: HEAD~1` compares one attempt against the previous one.
on:
  pull_request:
  push:
    branches:
      - 'rt/**'
    tags:
      - 'signa-core-[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  # Reads the trailers and decides whether to run.
  plan:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.plan.outputs.run }}
      filter: ${{ steps.plan.outputs.filter }}
      base: ${{ steps.plan.outputs.base }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # A pull request checks out a merge commit, but the trailers are
          # on the branch tip.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Read the trailers
        id: plan
        run: |
          trailer() {
            if [[ "$GITHUB_REF_TYPE" != tag ]]; then
              git log -1 --format="%(trailers:key=$1,valueonly)" | head -n 1
            fi
          }

          # A tag always runs. A branch or pull request runs when its head
          # commit has a `Bench-` trailer. An unknown one is more likely a
          # typo than a new request, so it fails the run instead of being
          # ignored.
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            run=true
          else
            keys=$(git log -1 --format='%(trailers:only,keyonly)' |
              grep -i '^bench-' || true)
            unknown=$(grep -ivxE 'bench-(filter|base)' <<< "$keys" |
              paste -sd ' ' - || true)
            if [[ -n "$unknown" ]]; then
              echo "::error::Unknown trailer: $unknown"
              exit 1
            fi
            if [[ -n "$keys" ]]; then
              run=true
            else
              run=false
              echo "No Bench- trailer in the head commit. Skipping."
            fi
          fi

          filter=$(trailer Bench-Filter)
          if [[ "$filter" == default ]]; then
            filter=
          fi

          {
            echo "run=$run"
            echo "filter=$filter"
            echo "base=$(trailer Bench-Base)"
          } >> "$GITHUB_OUTPUT"

  # Compares the benchmarks against a base commit. Shared runners are noisy,
  # so the result is informational and never fails the job. Clippy and the
  # benchmark assertions run in `ci`.
  #
  # One runner is enough. Nothing in signa depends on the CPU, and the
  # delimiter scans that do live in siparse, whose own benchmark CI runs them
  # on each target.
  #
  # Base and head run on the same runner in the same job, so what matters is
  # the difference, not the absolute numbers. A change of a few percent is
  # jitter here, which the threshold in the summary hides.
  compare:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A newer requested run on the same branch makes an in-flight comparison
    # stale. A push and the pull request for it share the branch name, so
    # only the later of the two runs. The group is on the job, not the
    # workflow, so that a push without a trailer leaves a requested run
    # alone.
    concurrency:
      group: bench-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true
    env:
      # The message and endpoint groups. The per-value groups, `from_bytes`
      # and `from_shared`, are left out. Each takes a few nanoseconds, the
      # `parse` group runs the same code on whole messages, and together they
      # would add as much time again to the run.
      FILTER: ${{ needs.plan.outputs.filter || '^(parse|encode|frame|prepend|transaction|transport|endpoint)/' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The base commit and the earlier release tags.
          fetch-depth: 0
          fetch-tags: true
      - name: Pick the base commit
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REQUESTED: ${{ needs.plan.outputs.base }}
        run: |
          # A pull request checks out a merge commit, so its head is the
          # branch tip instead.
          head="${PR_HEAD_SHA:-$GITHUB_SHA}"

          if [[ -n "$REQUESTED" ]]; then
            # `HEAD` names the head commit, not the merge commit.
            base=$(git rev-parse --verify "${REQUESTED/#HEAD/$head}^{commit}")
            label="$REQUESTED ($base)"
          elif [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            base="$PR_BASE_SHA"
            label="$base"
          elif [[ "$GITHUB_REF_TYPE" == branch ]]; then
            base=$(git merge-base origin/main "$head")
            label="main ($base)"
          else
            # The highest signa-core release below this tag. Only
            # `signa-core-x.y.z` tags count as a base, so a pre-release
            # never is one.
            previous=$(
              {
                git tag --list | grep -E '^signa-core-[0-9]+\.[0-9]+\.[0-9]+$'
                echo "$GITHUB_REF_NAME"
              } | sort -uV | awk -v tag="$GITHUB_REF_NAME" \
                '$0 == tag { print prev; exit } { prev = $0 }'
            )
            if [[ -z "$previous" ]]; then
              echo "No release before $GITHUB_REF_NAME. Skipping."
              exit 0
            fi
            base=$(git rev-parse "$previous^{commit}")
            label="$previous"
          fi
          {
            echo "BASE_SHA=$base"
            echo "BASE_LABEL=$label"
          } >> "$GITHUB_ENV"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Install critcmp
        run: cargo install --locked critcmp
      # `bench/target` is ignored by Git, so the saved baseline survives the
      # checkouts below.
      - name: Benchmark the base commit
        id: base
        run: |
          # A first release has no base, and an old base may predate the
          # benchmark crate.
          if [[ -z "$BASE_SHA" ]]; then
            exit 0
          fi
          if ! git cat-file -e "$BASE_SHA:bench/Cargo.toml" 2>/dev/null; then
            echo "No benchmarks at base commit $BASE_SHA. Skipping."
            exit 0
          fi
          git checkout --detach "$BASE_SHA"
          (cd bench && cargo bench -- "$FILTER" --save-baseline base)
          git checkout --detach "$GITHUB_SHA"
          echo "ran=true" >> "$GITHUB_OUTPUT"
      - name: Benchmark the head commit
        if: steps.base.outputs.ran == 'true'
        working-directory: bench
        run: cargo bench -- "$FILTER" --save-baseline head
      - name: Compare
        if: steps.base.outputs.ran == 'true'
        working-directory: bench
        # `-t 5` alone prints nothing useful when no benchmark moved by 5% or
        # more, so print the full table first. The summary shows the same
        # tables on the run page.
        run: |
          {
            echo "## Benchmarks against $BASE_LABEL"
            echo
            echo '```'
            critcmp base head
            echo '```'
            echo
            echo "Changes of 5% or more:"
            echo
            echo '```'
            critcmp -t 5 base head || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # Memory is a goal too. The tables example fills both tables with 200k
      # transactions, and the maximum RSS says what each one costs. The time
      # per round trip is as noisy as the benchmarks above, and the RSS moves
      # by a few percent between runs, with where the allocator puts the
      # tables as they grow. The script skips nothing, so a base without the
      # example fails the step, which `continue-on-error` keeps from failing
      # the job.
      - name: Measure the tables
        if: steps.base.outputs.ran == 'true'
        continue-on-error: true
        run: |
          [[ -x /usr/bin/time ]] || sudo apt-get install -y time
          {
            echo "## Tables against $BASE_LABEL"
            echo
            echo '```'
            scripts/tables -c "$BASE_LABEL"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
