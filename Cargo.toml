[package]
name = "signa"
version = "0.1.0"
authors = ["Ryuma Taguchi <ryumatag@gmail.com>"]
description = "A fast and correct low-level SIP library"
repository = "https://github.com/ryumatag/signa"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["sip", "rfc3261", "voip", "telephony"]
categories = ["network-programming"]
edition = "2021"
rust-version = "1.65"
include = [
  "/src/**/*.rs",
  "/README.md",
  "LICENSE-APACHE",
  "LICENSE-MIT",
]

[features]
default = []
# Exposes crate internals to the benchmark crate in `bench/`. Unstable, with
# no semver guarantee. Not for use outside this repository.
__bench = []

[dependencies]
bytes = { version = "1.12.1", default-features = false, features = ["std"] }
siparse = "0.4.0"
